spring:
  application:
    name: Pop O Bob
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

server:
  port: ${PORT:8080}

app:
  seed:
    enabled: true

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

logging:
  level:
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR

# -------------------------------------------------------
# LOCAL DEVELOPMENT ONLY — never commit a real secret here
# Production reads JWT_SECRET from the Railway environment variable.
# This value is used ONLY when running on localhost.
# -------------------------------------------------------
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-min-32chars}
  expiration: 86400000

gemini:
  api:
    key: ${GEMINI_API_KEY:your_gemini_api_key_here}

msg91:
  auth-key: ${MSG91_AUTH_KEY}
  template-id: ${MSG91_TEMPLATE_ID:SecureOTPWidget5TUR}
